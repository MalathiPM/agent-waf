services:
  waf:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://waf:waf@db:5432/waf
      POLICY_FILE: ${POLICY_FILE:-policies/agent-support.yaml}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: waf
      POSTGRES_PASSWORD: waf
      POSTGRES_DB: waf
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waf -d waf"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
