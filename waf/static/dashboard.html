<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent WAF — Live Traffic</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#252a34; --text:#e6e8ec; --dim:#8b93a7;
          --allow:#3fb950; --block:#f85149; --shadow:#d29922; }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px; background:var(--bg); color:var(--text);
         font:14px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace; }
  h1 { font-size:18px; margin:0 0 4px; font-weight:600; }
  .sub { color:var(--dim); margin-bottom:20px; font-size:13px; }
  .cards { display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px;
          padding:14px 18px; min-width:120px; }
  .card .n { font-size:26px; font-weight:600; }
  .card .l { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
  .allow .n { color:var(--allow); } .block .n { color:var(--block); } .shadow .n { color:var(--shadow); }
  table { width:100%; border-collapse:collapse; background:var(--panel);
          border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  th { text-align:left; padding:10px 12px; color:var(--dim); font-weight:500;
       font-size:12px; text-transform:uppercase; letter-spacing:.06em;
       border-bottom:1px solid var(--line); }
  td { padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr:last-child td { border-bottom:none; }
  .tag { padding:2px 8px; border-radius:4px; font-size:12px; font-weight:600; }
  .tag.ALLOW { background:rgba(63,185,80,.15); color:var(--allow); }
  .tag.BLOCK { background:rgba(248,81,73,.15); color:var(--block); }
  .tag.SHADOW_BLOCK { background:rgba(210,153,34,.15); color:var(--shadow); }
  .dim { color:var(--dim); }
  .params { max-width:420px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
</style>
</head>
<body>
  <h1>Agent WAF — Live Traffic</h1>
  <div class="sub">Every tool call intercepted, evaluated, and logged. Refreshing every 2s.</div>

  <div class="cards">
    <div class="card"><div class="n" id="total">0</div><div class="l">Total</div></div>
    <div class="card allow"><div class="n" id="allow">0</div><div class="l">Allowed</div></div>
    <div class="card block"><div class="n" id="block">0</div><div class="l">Blocked</div></div>
    <div class="card shadow"><div class="n" id="shadow">0</div><div class="l">Shadow</div></div>
  </div>

  <table>
    <thead><tr>
      <th>Time</th><th>Agent</th><th>Tool</th><th>Params</th>
      <th>Disposition</th><th>Rule</th><th>Reason</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>

<script>
async function refresh() {
  try {
    const res = await fetch("/v1/audit?limit=50");
    const { records } = await res.json();

    const counts = { ALLOW: 0, BLOCK: 0, SHADOW_BLOCK: 0 };
    records.forEach(r => counts[r.disposition] = (counts[r.disposition] || 0) + 1);
    document.getElementById("total").textContent  = records.length;
    document.getElementById("allow").textContent  = counts.ALLOW;
    document.getElementById("block").textContent  = counts.BLOCK;
    document.getElementById("shadow").textContent = counts.SHADOW_BLOCK;

    document.getElementById("rows").innerHTML = records.map(r => `
      <tr>
        <td class="dim">${new Date(r.timestamp).toLocaleTimeString()}</td>
        <td>${r.agent_id}</td>
        <td>${r.tool}</td>
        <td class="params dim">${JSON.stringify(r.params)}</td>
        <td><span class="tag ${r.disposition}">${r.disposition}</span></td>
        <td class="dim">${r.matched_rule ?? "—"}</td>
        <td class="dim">${r.reason ?? "—"}</td>
      </tr>`).join("");
  } catch (e) {
    console.error("refresh failed", e);
  }
}
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
